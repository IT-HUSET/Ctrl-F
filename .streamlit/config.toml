# Evergreen, the default theme. Keep in step with EVERGREEN in src/ctrlf/theme.py, which
# also holds the Black metal alternative and the CSS layer for both.

[browser]
# Streamlit collects usage statistics by default, which is a network call.
# The prototype promises that nothing leaves the machine at run time.
gatherUsageStats = false

[server]
# The first-run email prompt blocks startup until someone types into the terminal.
showEmailPrompt = false

[client]
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#1d6b57"
backgroundColor = "#f5f7f3"
secondaryBackgroundColor = "#e8efea"
textColor = "#17312b"
linkColor = "#24477a"
borderColor = "#c9d6ce"
showWidgetBorder = true
baseRadius = "medium"
font = "sans-serif"
headingFont = "sans-serif"
headingFontWeights = 700
codeFont = "monospace"

[theme.sidebar]
backgroundColor = "#eaf1ec"
secondaryBackgroundColor = "#ffffff"
